<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight · <span class="status" aria-live="polite"></span></p>
    </header>
    <main data-testid="board" aria-busy="true">
      <div data-testid="loader" class="loader" role="status">Loading incidents…</div>
      <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
      <ul data-testid="incident-list" class="list" hidden></ul>
    </main>
    <div class="confirm-backdrop" hidden>
      <div data-testid="confirm" class="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-what">
        <p id="confirm-title" class="confirm-title">Ack <strong class="confirm-id"></strong>?</p>
        <p id="confirm-what" class="confirm-what"></p>
        <div class="confirm-actions">
          <button type="button" data-testid="confirm-cancel">Cancel</button>
          <button type="button" data-testid="confirm-ack">Ack <span class="confirm-id"></span></button>
        </div>
      </div>
    </div>
    <footer>sched-prod incident board · build <code data-testid="build-sha">965621473b96f8731ee38af0d3724c6560676b21</code></footer>
  </body>
</html>
